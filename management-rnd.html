    "content": "<div class=\"lesson-rows\"><div class=\"lesson-row\"><h3>강의 자료<\/h3><p>샘플 텍스트와 원문 검토 메모<\/p><\/div><div class=\"lesson-row\"><h3>관리 웹앱<\/h3><p>최종 HTML, JSON 백업, 개인 기능 점검 기록<\/p><\/div><div class=\"lesson-row\"><h3>적용 계획<\/h3><p>다음 주 적용할 업무 하나와 미해결 항목<\/p><\/div><\/div><div class=\"lesson-links\"><a href=\"rnd/연구개발관리_샘플.json\" download>샘플 JSON 다운로드<\/a><a href=\"rnd/연구개발관리_샘플.txt\" download>샘플 텍스트 다운로드<\/a><a href=\"rnd/연구개발관리_웹앱_완성예시.html\" target=\"_blank\" rel=\"noopener\">관리 웹앱 완성 예시 열기<\/a><\/div>"

  {

    "part": "Module 4",

    "badge": "연구개발 관리 실무",
    "title": "관리할 업무를 정하고, 확인한 결과를 남깁니다",
    "subtitle": "영사이언스 연구개발 관리·학술지원 AI 실무",
    "content": "<div class=\"lesson-rows\"><div class=\"lesson-row\"><h3>자료<\/h3><p>근거와 누락 정보를 구분합니다.<\/p><\/div><div class=\"lesson-row\"><h3>과제<\/h3><p>담당자·기한·다음 조치를 명확히 합니다.<\/p><\/div><div class=\"lesson-row\"><h3>도구<\/h3><p>작게 만들고 직접 시험하며 업무에 맞춰 개선합니다.<\/p><\/div><\/div>"
  }
];

    // ================= STATE & RENDERING ENGINE =================
    let currentIndex = 0;
    const navySlideIds = [1, 5, 13, 21, 37, 48];

    function updateModuleTabs(slideId) {
      const tabs = [
        { id: 'tab-part-0', min: 1, max: 4 },
        { id: 'tab-part-1', min: 5, max: 12 },
        { id: 'tab-part-2', min: 13, max: 20 },
        { id: 'tab-part-3', min: 21, max: 36 },
        { id: 'tab-part-4', min: 37, max: 48 }
      ];
      tabs.forEach(t => {
        const el = document.getElementById(t.id);
        if (!el) return;
        if (slideId >= t.min && slideId <= t.max) {
          el.className = "mod-tab px-2.5 py-1 rounded-md font-bold transition bg-blue-600 text-white shadow-sm";
        } else {
          el.className = "mod-tab px-2.5 py-1 rounded-md font-semibold transition text-slate-400 hover:text-white";
        }
      });
    }

    function renderSlide(index) {
      if (index < 0) index = 0;
      if (index >= slides.length) index = slides.length - 1;
      currentIndex = index;

      const slide = slides[currentIndex];
      const container = document.getElementById('active-slide-container');
      const isNavy = navySlideIds.includes(slide.id);

      if (isNavy) {
        container.classList.add('slide-theme-navy');
      } else {
        container.classList.remove('slide-theme-navy');
      }

      container.innerHTML = `
        <!-- Floating Mini Bar in Fullscreen Mode -->
        <div id="fs-floating-bar" class="absolute top-3 right-4 z-40 items-center space-x-1.5 bg-slate-900/80 backdrop-blur px-3 py-1.5 rounded-full border border-slate-700 text-white text-xs opacity-20 hover:opacity-100 transition-opacity duration-200 select-none">
          <span class="font-mono text-blue-400 font-bold mr-1">${slide.id} / ${slides.length}</span>
          <button onclick="renderSlide(currentIndex - 1)" class="px-2 py-0.5 hover:bg-slate-700 rounded"><i class="fa-solid fa-chevron-left"></i></button>
          <button onclick="renderSlide(currentIndex + 1)" class="px-2 py-0.5 hover:bg-slate-700 rounded"><i class="fa-solid fa-chevron-right"></i></button>
          <button onclick="toggleFullscreen()" class="px-2 py-0.5 hover:bg-red-600/80 rounded ml-1" title="전체화면 종료 (ESC)"><i class="fa-solid fa-compress"></i></button>
        </div>

        <!-- Slide Header -->
        <div class="slide-header-box px-7 py-5 border-b border-slate-200 bg-slate-50/70 flex flex-col justify-between shrink-0">
          <div class="flex items-center justify-between mb-2">
            <div class="flex items-center space-x-2">
              <span class="px-2.5 py-0.5 rounded-md text-[11px] font-extrabold uppercase tracking-wider ${isNavy ? 'bg-blue-500/20 text-blue-300 border border-blue-400/30' : 'bg-blue-600 text-white'}">${slide.tag}</span>
              <span class="text-xs font-bold ${isNavy ? 'text-slate-300' : 'text-blue-700'}">${slide.badge}</span>
              <span class="text-slate-400 text-xs">·</span>
              <span class="text-xs font-medium ${isNavy ? 'text-slate-400' : 'text-slate-500'}">${slide.module}</span>
            </div>
            <span class="font-mono text-xs font-bold ${isNavy ? 'text-slate-400' : 'text-slate-400'}">SLIDE ${String(slide.id).padStart(2, '0')}</span>
          </div>
          <h2 class="slide-header-title text-xl md:text-2xl font-extrabold text-slate-900 tracking-tight leading-snug">${slide.title}</h2>
          <p class="slide-header-sub text-xs md:text-sm text-slate-600 mt-1">${slide.subtitle}</p>
        </div>

        <!-- Slide Body -->
        <div class="slide-body-box p-7 flex-1 overflow-y-auto flex flex-col justify-center bg-white">
          ${slide.content}
        </div>

        <!-- Slide Internal Footer -->
        <div class="slide-footer-box px-7 py-2.5 border-t border-slate-200 bg-slate-50 flex items-center justify-between text-[11px] text-slate-500 shrink-0 select-none">
          <div class="flex items-center space-x-2">
            <span class="font-bold ${isNavy ? 'text-slate-300' : 'text-slate-700'}">영사이언스 연구개발 관리 AI 실무</span>
            <span>|</span>
            <span>Data Thinking Lab × EXPERT Consulting</span>
          </div>
          <div class="font-mono font-semibold">${slide.id} / ${slides.length}</div>
        </div>
      `;

      // Update Global Counters & Progress
      document.getElementById('slide-num-current').textContent = slide.id;
      document.getElementById('slide-num-total').textContent = slides.length;
      const pct = Math.round(((currentIndex + 1) / slides.length) * 100);
      document.getElementById('progress-bar-fill').style.width = `${pct}%`;

      updateModuleTabs(slide.id);
      bindCopyButtons();
    }

    function jumpToSlide(idx) {
      renderSlide(idx);
    }

    // ================= CLIPBOARD COPY HANDLER =================
    function copyTextToClipboard(text) {
      return new Promise((resolve, reject) => {
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).then(resolve).catch(() => fallbackCopy(text, resolve, reject));
        } else {
          fallbackCopy(text, resolve, reject);
        }
      });
    }

    function fallbackCopy(text, resolve, reject) {
      try {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        textArea.style.left = "-9999px";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(textArea);
        ok ? resolve() : reject();
      } catch (e) {
        reject(e);
      }
    }

    function bindCopyButtons() {
      document.querySelectorAll('.copy-btn').forEach(btn => {
        btn.onclick = () => {
          const targetId = btn.getAttribute('data-target');
          const pre = document.getElementById(targetId);
          if (!pre) return;
          copyTextToClipboard(pre.innerText).then(() => {
            showToast("프롬프트가 클립보드에 복사되었습니다. AI 채팅창에 붙여넣으세요!");
            const origHTML = btn.innerHTML;
            btn.innerHTML = `<i class="fa-solid fa-check"></i><span>복사 완료!</span>`;
            btn.classList.replace('bg-blue-600', 'bg-emerald-600');
            setTimeout(() => {
              btn.innerHTML = origHTML;
              btn.classList.replace('bg-emerald-600', 'bg-blue-600');
            }, 1800);
          });
        };
      });
    }

    function showToast(msg) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = "bg-slate-900 text-white border border-blue-500/50 px-4 py-2.5 rounded-xl shadow-2xl text-xs font-semibold flex items-center space-x-2 animate-bounce";
      toast.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400"></i><span>${msg}</span>`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 2500);
    }

    // ================= TOC MODAL =================
    function buildTOC() {
      const grid = document.getElementById('toc-grid');
      grid.innerHTML = slides.map((s, idx) => `
        <button onclick="selectTOCSlide(${idx})" class="text-left p-3 rounded-xl border ${idx === currentIndex ? 'border-blue-600 bg-blue-50/70' : 'border-slate-200 bg-white hover:border-blue-400'} transition flex items-start space-x-3 shadow-sm">
          <span class="font-mono text-xs font-bold px-2 py-0.5 rounded ${navySlideIds.includes(s.id) ? 'bg-slate-900 text-blue-400' : 'bg-slate-100 text-slate-700'} shrink-0">${String(s.id).padStart(2, '0')}</span>
          <div class="overflow-hidden">
            <div class="text-[10px] font-bold text-blue-600 uppercase truncate">${s.part} · ${s.badge}</div>
            <div class="text-xs font-bold text-slate-900 truncate mt-0.5">${s.title}</div>
          </div>
        </button>
      `).join('');
    }

    function toggleTOC() {
      const modal = document.getElementById('toc-modal');
      if (modal.classList.contains('hidden')) {
        buildTOC();
        modal.classList.remove('hidden');
        setTimeout(() => modal.classList.remove('opacity-0'), 10);
      } else {
        modal.classList.add('opacity-0');
        setTimeout(() => modal.classList.add('hidden'), 200);
      }
    }

    function selectTOCSlide(idx) {
      renderSlide(idx);
      toggleTOC();
    }

    // ================= PURE SLIDE FULLSCREEN =================
    function toggleFullscreen() {
      const isPure = document.body.classList.toggle('fullscreen-pure-slide');
      if (isPure) {
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => {});
        }
        showToast("슬라이드 전용 전체화면 모드 (종료: ESC 또는 F)");
      } else {
        if (document.fullscreenElement && document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        }
      }
    }

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        document.body.classList.remove('fullscreen-pure-slide');
      }
    });

    // ================= PDF PRINT ALL SLIDES =================
    function printAllSlides() {
      const printContainer = document.getElementById('print-all-slides');
      printContainer.innerHTML = slides.map(s => `
        <div class="print-slide-page">
          <div class="border-b-2 border-slate-300 pb-3 mb-4 flex justify-between items-start">
            <div>
              <div class="text-xs font-bold text-blue-700 uppercase">${s.part} · ${s.module} (${s.badge})</div>
              <h1 class="text-xl font-extrabold text-slate-900 mt-0.5">${s.title}</h1>
              <p class="text-xs text-slate-600 mt-0.5">${s.subtitle}</p>
            </div>
            <span class="font-mono text-xs font-bold text-slate-500">SLIDE ${s.id} / ${slides.length}</span>
          </div>
          <div class="flex-1 flex flex-col justify-center">${s.content}</div>
          <div class="border-t border-slate-200 pt-2 mt-4 flex justify-between text-[10px] text-slate-500">
            <span>© 2026 Data Thinking Lab. All rights reserved. | 영사이언스 연구개발 관리 AI 실무 교육</span>
            <span>Page ${s.id} of ${slides.length}</span>
          </div>
        </div>
      `).join('');
      window.print();
    }

    // ================= EVENT LISTENERS & SAFE BOOTSTRAP =================
    function initDeck() {
      document.getElementById('btn-prev').onclick = () => renderSlide(currentIndex - 1);
      document.getElementById('btn-next').onclick = () => renderSlide(currentIndex + 1);
      document.getElementById('btn-toc').onclick = toggleTOC;
      document.getElementById('toc-close-btn').onclick = toggleTOC;
      document.getElementById('btn-fullscreen').onclick = toggleFullscreen;
      document.getElementById('btn-print').onclick = printAllSlides;

      document.addEventListener('keydown', (e) => {
        if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
        if (e.key === 'ArrowRight' || e.key === ' ') {
          e.preventDefault();
          renderSlide(currentIndex + 1);
        } else if (e.key === 'ArrowLeft') {
          e.preventDefault();
          renderSlide(currentIndex - 1);
        } else if (e.key === 'o' || e.key === 'O') {
          e.preventDefault();
          toggleTOC();
        } else if (e.key === 'f' || e.key === 'F') {
          e.preventDefault();
          toggleFullscreen();
        } else if (e.key === 'p' || e.key === 'P') {
          e.preventDefault();
          printAllSlides();
        } else if (e.key === 'Escape') {
          const modal = document.getElementById('toc-modal');
          if (!modal.classList.contains('hidden')) toggleTOC();
          document.body.classList.remove('fullscreen-pure-slide');
        }
      });

      renderSlide(0);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initDeck);
    } else {
      initDeck();
    }
  </script>
